<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alguma Coisa</title>
    <style>
    header {
        background-color: rgb(0, 0, 0);
        color: #ffffff;
        text-align: center;
        max-width: 800px;
        margin: 0 auto;
        padding: 16px;
        border: 5px solid #a7a2a2;
    }
    main{
        background-color: #000000;
        color: #ffffff;
        max-width: 800px;
        margin: 0 auto;
        padding: 16px;
        display: flex;
    }
        img{
            width: 80px;
            height: 80px;
        }
        .artigo-autor{
            font-weight: bold;
        }
</style>
</head>
<body>
    <header>
    <h1>Meu blog tech</h1>
    <p>Vou compartilhar conhecimentos sobre tecnologia e programação</p>
    </header>
<main>
    <img src="tecnologia.png" alt="A imagem representa o conceito de tecnologia aplicada à educação (EdTech), aprendizado digital, inovação no ensino e o futuro do conhecimento ao alcance das mãos.">
    <div>
    <h2>Meu primeiro post</h2>
    <p class="artigo-autor"> Por: Emanuel PL</p>
    <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.</p>
    <button>❤️ <span>0</span></button>
    </div>
  </main>
</body>
<script>
    const botao = document.querySelector("button");
    botao.addEventListener("click", botaoClicado);

    function botaoClicado(){
        console.log("fui clicado");
        let texto = botao.querySelector("span");
        texto.textContent++;
    }
</script>
</html>
